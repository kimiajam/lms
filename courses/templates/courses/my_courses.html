{% extends 'courses/base.html' %}

{% block content %}

<h1>My Courses</h1>

{% for course in courses %}
    <h2>
        <a href="{% url 'course_detail' course.id %}">
            {{ course.title }}
        </a>
    </h2>

    <p>{{ course.description }}</p>
{% empty %}
    <p>You are not enrolled in any course.</p>
{% endfor %}

{% endblock %}
